name: SATRIA focused regression

on:
  push:
    branches:
      - fix/wcp-race-regression-v2

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal runtime dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Compile complete engine
        run: python -m py_compile satria_engine.py
      - name: WCP cache-state and proof regression
        run: |
          python - <<'PY'
          import importlib.util
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner
          scanner = Scanner.__new__(Scanner)

          has_cache, is_hit, summary = scanner._wcp_cache_state(
              SimpleNamespace(headers={"Cache-Status": "edge; hit; ttl=60"})
          )
          assert has_cache and is_hit and "cache-status" in summary.lower(), (has_cache, is_hit, summary)

          has_cache, is_hit, _ = scanner._wcp_cache_state(
              SimpleNamespace(headers={"CF-Cache-Status": "MISS"})
          )
          assert has_cache and not is_hit

          marker = "satria-regression-marker-unique"
          responses = iter([
              SimpleNamespace(status=200, headers={"Cache-Control": "no-store"}, text="clean baseline", error=None),
              SimpleNamespace(status=200, headers={"X-Cache": "MISS"}, text="origin response", error=None),
              SimpleNamespace(status=200, headers={"X-Cache": "HIT"}, text=f"<html>{marker}</html>", error=None),
              SimpleNamespace(status=200, headers={"Cache-Status": "edge; hit"}, text=f"<html>{marker}</html>", error=None),
              SimpleNamespace(status=404, headers={}, text="not found", error=None),
          ])
          scanner._within_budget = lambda: True
          scanner._wcp_clone_session = lambda extra_cookies=None: object()
          scanner._request = lambda *args, **kwargs: next(responses)
          proof = scanner._wcp_attempt("https://example.test/", marker)
          assert proof and marker in proof and "cache-status" in proof.lower(), proof

          responses = iter([
              SimpleNamespace(status=200, headers={}, text="clean baseline", error=None),
              SimpleNamespace(status=200, headers={}, text="origin response", error=None),
              SimpleNamespace(status=200, headers={}, text=f"<html>{marker}</html>", error=None),
              SimpleNamespace(status=200, headers={}, text=f"<html>{marker}</html>", error=None),
              SimpleNamespace(status=404, headers={}, text="not found", error=None),
          ])
          scanner._request = lambda *args, **kwargs: next(responses)
          assert scanner._wcp_attempt("https://example.test/", marker) is None

          print("PASS: cache indicators and poisoning proof controls")
          PY

      - name: Race burst synchronization regression
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from types import SimpleNamespace
          from urllib.parse import urlparse
          import requests

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          state = {"active": 0, "max_active": 0}
          lock = threading.Lock()

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  with lock:
                      state["active"] += 1
                      state["max_active"] = max(state["max_active"], state["active"])
                  try:
                      time.sleep(0.20)
                      body = b"ok"
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  finally:
                      with lock:
                          state["active"] -= 1
              def log_message(self, *_args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          base = f"http://127.0.0.1:{server.server_port}/race-test"
          scanner = Scanner.__new__(Scanner)
          scanner.session = requests.Session()
          scanner.timeout = 3.0
          scanner.request_count = 0
          scanner.stats = {"requests": 0}
          scanner._within_budget = lambda: scanner.request_count < 12
          scanner._same_origin = lambda url: (
              urlparse(url).scheme == urlparse(base).scheme
              and urlparse(url).netloc == urlparse(base).netloc
          )
          try:
              results = scanner._race_burst(None, "GET", base, [None] * 4, n=4)
              assert len(results) == 4 and all(result.status == 200 for result in results)
              assert state["max_active"] >= 2, state
              assert scanner.request_count == 4 and scanner.stats["requests"] == 4
              print(f"PASS: {state['max_active']} concurrent requests; budget count={scanner.request_count}")
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=2)
          PY

      - name: Race-condition helper regression
        run: |
          python - <<'PY'
          import importlib.util
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner
          scanner = Scanner.__new__(Scanner)

          assert not scanner._race_rejected(SimpleNamespace(
              status=200, text="The operation completed; no errors were reported.", headers={}, error=None
          ))
          assert not scanner._race_rejected(SimpleNamespace(
              status=200, text="The request failed validation only in the optional field.", headers={}, error=None
          ))
          assert scanner._race_rejected(SimpleNamespace(
              status=200, text="This token is invalid or already used.", headers={}, error=None
          ))
          assert scanner._race_rejected(SimpleNamespace(
              status=429, text="Please retry later.", headers={}, error=None
          ))
          print("PASS: race rejection classification")
          PY
