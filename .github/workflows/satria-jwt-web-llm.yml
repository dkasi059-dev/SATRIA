name: SATRIA JWT and Web LLM regression

on:
  push:
    branches:
      - fix/jwt-web-llm-20261114

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 "PyJWT[crypto]" "gmpy2>=2.3,<3"
      - name: Compile complete engine
        run: python -m py_compile satria_engine.py
      - name: JWT helper and crypto regression
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import time
          import jwt
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          token = Scanner._jwt_sign(
              {"alg": "HS256", "typ": "JWT"},
              {"sub": "wiener", "exp": int(time.time()) + 3600},
              key="not-a-weak-secret",
          )
          assert token and Scanner._jwt_decode(token)["payload"]["sub"] == "wiener"
          assert token in Scanner._jwt_tokens_in_text("Authorization: Bearer " + token)
          assert token in Scanner._jwt_tokens_in_text('<div data-token="' + token + '"></div>')
          assert token in Scanner._jwt_tokens_in_text(token.replace(".", "%2E"))

          private_key = rsa.generate_private_key(public_exponent=65537, key_size=1024)
          private_pem = private_key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          )
          token_a = jwt.encode({"sub": "one", "n": 1}, private_pem, algorithm="RS256")
          token_b = jwt.encode({"sub": "two", "n": 2}, private_pem, algorithm="RS256")
          token_c = jwt.encode({"sub": "three", "n": 3}, private_pem, algorithm="RS256")
          derived = Scanner._jwt_rsa_pem_from_tokens([token_a, token_b, token_c])
          assert derived and "BEGIN PUBLIC KEY" in derived[0], "RSA modulus derivation failed"
          assert "BEGIN RSA PUBLIC KEY" in derived[1], "PKCS1 public key variant missing"
          print("PASS: JWT extraction, decode, RS256 modulus derivation")
          PY
      - name: JWT live verification regression
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse
          import requests

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          state = {"mode": "ignore"}
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  token = ""
                  auth = self.headers.get("Authorization", "")
                  if auth.lower().startswith("bearer "):
                      token = auth.split(None, 1)[1]
                  if not token:
                      cookie = self.headers.get("Cookie", "")
                      for part in cookie.split(";"):
                          if part.strip().startswith("session="):
                              token = part.strip().split("=", 1)[1]
                  decoded = Scanner._jwt_decode(token) if token else None
                  accepted = False
                  username = ""
                  if decoded:
                      header = decoded["header"]
                      payload = decoded["payload"]
                      username = str(payload.get("sub", ""))
                      if state["mode"] == "ignore":
                          accepted = bool(username)
                      elif state["mode"] == "none_only":
                          accepted = str(header.get("alg", "")).lower() == "none" and not decoded["parts"][2]
                  if accepted:
                      body = (
                          "<html><h1>Admin panel</h1> User management "
                          f"Your username is: {username} <a>Log out</a></html>"
                      ).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  elif decoded and username == "wiener" and state["mode"] == "ignore":
                      body = b"<html>Your username is: wiener <a>Log out</a></html>"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      body = b"<html>Please log in</html>"
                      self.send_response(302)
                      self.send_header("Location", "/login")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              def log_message(self, *_args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          base = f"http://127.0.0.1:{server.server_port}"
          def scanner_for(token, confirmed=None):
              scanner = Scanner.__new__(Scanner)
              scanner.target_url = base + "/"
              scanner.session = requests.Session()
              scanner.session.cookies.set("session", token)
              scanner.timeout = 2.0
              scanner.started = time.monotonic()
              scanner.deadline_seconds = 25.0
              scanner.max_requests = 400
              scanner.non_sql_category_request_limit = 32
              scanner.request_count = 0
              scanner._scan_progress = {
                  "index": 17, "total": 23, "label": "JWT", "event_seq": 0,
                  "request_start": 0, "request_limit": 160,
              }
              scanner.stats = {"requests": 0, "errors": []}
              scanner._confirmed = set(confirmed or [])
              scanner._jwt_login_artifacts = []
              scanner._jwt_mark = lambda number, url, evidence, method: scanner._confirmed.add(number)
              return scanner

          try:
              source = Scanner._jwt_sign(
                  {"alg": "HS256", "typ": "JWT"},
                  {"sub": "wiener", "exp": int(time.time()) + 3600},
                  key="unrelated-random-source-key",
              )
              state["mode"] = "ignore"
              scanner = scanner_for(source)
              scanner.phase_jwt(
                  [module.Page(url=base + "/my-account", text="<title>My account</title>")],
                  [],
              )
              assert 147 in scanner._confirmed, scanner._confirmed

              state["mode"] = "none_only"
              scanner = scanner_for(source, confirmed={147})
              scanner.phase_jwt(
                  [module.Page(url=base + "/my-account", text="<title>My account</title>")],
                  [],
              )
              assert 148 in scanner._confirmed, scanner._confirmed
              print("PASS: live JWT unverified-signature and alg=none detection")
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=2)
          PY

      - name: JWT weak-key, JWK, kid and algorithm-confusion regression
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import importlib.util
          import json
          import sys
          import time
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import jwt
          import requests
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          server_key = rsa.generate_private_key(public_exponent=65537, key_size=1024)
          server_private_pem = server_key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          )
          server_public_pem = server_key.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          numbers = server_key.public_key().public_numbers()
          def b64u_int(value):
              return base64.urlsafe_b64encode(
                  value.to_bytes((value.bit_length() + 7) // 8, "big")
              ).rstrip(b"=").decode()
          jwks = {"keys": [{
              "kty": "RSA", "kid": "server-key", "use": "sig", "alg": "RS256",
              "n": b64u_int(numbers.n), "e": b64u_int(numbers.e),
          }]}

          state = {"mode": "weak"}
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/.well-known/jwks.json") and state["mode"] == "confusion":
                      body = json.dumps(jwks).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  token = ""
                  auth = self.headers.get("Authorization", "")
                  if auth.lower().startswith("bearer "):
                      token = auth.split(None, 1)[1]
                  if not token:
                      for part in self.headers.get("Cookie", "").split(";"):
                          if part.strip().startswith("session="):
                              token = part.strip().split("=", 1)[1]
                  decoded = Scanner._jwt_decode(token) if token else None
                  accepted = False
                  username = ""
                  if decoded:
                      header, payload, parts = decoded["header"], decoded["payload"], decoded["parts"]
                      username = str(payload.get("sub", ""))
                      signing_input = f"{parts[0]}.{parts[1]}".encode()
                      try:
                          signature = Scanner._jwt_b64d(parts[2])
                      except Exception:
                          signature = b""
                      if state["mode"] == "weak" and header.get("alg") == "HS256":
                          expected = hmac.new(b"secret1", signing_input, hashlib.sha256).digest()
                          accepted = hmac.compare_digest(expected, signature)
                      elif state["mode"] == "jwk" and header.get("alg") == "RS256" and isinstance(header.get("jwk"), dict):
                          try:
                              key = header["jwk"]
                              n = int.from_bytes(base64.urlsafe_b64decode(key["n"] + "=" * (-len(key["n"]) % 4)), "big")
                              e = int.from_bytes(base64.urlsafe_b64decode(key["e"] + "=" * (-len(key["e"]) % 4)), "big")
                              public = rsa.RSAPublicNumbers(e, n).public_key()
                              jwt.decode(token, public, algorithms=["RS256"], options={"verify_exp": False})
                              accepted = True
                          except Exception:
                              accepted = False
                      elif state["mode"] == "kid" and header.get("alg") == "HS256" and "dev/null" in str(header.get("kid", "")):
                          expected = hmac.new(b"", signing_input, hashlib.sha256).digest()
                          accepted = hmac.compare_digest(expected, signature)
                      elif state["mode"] == "confusion":
                          if header.get("alg") == "RS256":
                              try:
                                  jwt.decode(token, server_public_pem, algorithms=["RS256"], options={"verify_exp": False})
                                  accepted = True
                              except Exception:
                                  accepted = False
                          elif header.get("alg") == "HS256":
                              expected = hmac.new(server_public_pem, signing_input, hashlib.sha256).digest()
                              accepted = hmac.compare_digest(expected, signature)
                  if accepted and username == "administrator":
                      body = b"<html><h1>Admin panel</h1>User management <a>Log out</a></html>"
                      self.send_response(200)
                  elif accepted:
                      body = f"<html>Your username is: {username} <a>Log out</a></html>".encode()
                      self.send_response(200)
                  else:
                      body = b"<html>Please log in</html>"
                      self.send_response(302)
                      self.send_header("Location", "/login")
                  self.send_header("Content-Type", "text/html")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *_args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          base = f"http://127.0.0.1:{server.server_port}"

          def make_scanner(token, confirmed):
              scanner = Scanner.__new__(Scanner)
              scanner.target_url = base + "/"
              scanner.session = requests.Session()
              scanner.session.cookies.set("session", token)
              scanner.timeout = 2.0
              scanner.started = time.monotonic()
              scanner.deadline_seconds = 30.0
              scanner.max_requests = 500
              scanner.non_sql_category_request_limit = 32
              scanner.request_count = 0
              scanner._scan_progress = {
                  "index": 17, "total": 23, "label": "JWT", "event_seq": 0,
                  "request_start": 0, "request_limit": 180,
              }
              scanner.stats = {"requests": 0, "errors": []}
              scanner._confirmed = set(confirmed)
              scanner._jwt_login_artifacts = []
              scanner._jwt_mark = lambda number, url, evidence, method: scanner._confirmed.add(number)
              return scanner

          page = module.Page(url=base + "/my-account", text="<title>My account</title>")
          try:
              weak_token = Scanner._jwt_sign(
                  {"alg": "HS256", "typ": "JWT"},
                  {"sub": "wiener", "exp": int(time.time()) + 3600},
                  key="secret1",
              )
              state["mode"] = "weak"
              scanner = make_scanner(weak_token, {147, 148})
              scanner.phase_jwt([page], [])
              assert 149 in scanner._confirmed, scanner._confirmed

              rsa_source = jwt.encode(
                  {"sub": "wiener", "exp": int(time.time()) + 3600},
                  server_private_pem, algorithm="RS256",
              )
              state["mode"] = "jwk"
              scanner = make_scanner(rsa_source, {147, 148, 149})
              scanner.phase_jwt([page], [])
              assert 150 in scanner._confirmed, scanner._confirmed

              kid_source = Scanner._jwt_sign(
                  {"alg": "HS256", "typ": "JWT", "kid": "session"},
                  {"sub": "wiener", "exp": int(time.time()) + 3600},
                  key="not-empty",
              )
              state["mode"] = "kid"
              scanner = make_scanner(kid_source, {147, 148, 149, 150, 151})
              scanner.phase_jwt([page], [])
              assert 152 in scanner._confirmed, scanner._confirmed

              state["mode"] = "confusion"
              scanner = make_scanner(rsa_source, {147, 148, 149, 150, 151, 152})
              scanner.phase_jwt([page], [])
              assert 153 in scanner._confirmed, scanner._confirmed

              print("PASS: JWT weak HMAC, embedded JWK, kid traversal, RS->HS confusion")
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=2)
          PY

      - name: Web LLM discovery, JSON and SSE regression
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import re
          import sys
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse
          import requests

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner
          Response = module.Response
          Page = module.Page

          json_response = Response(
              200, "http://example.test", 
              json.dumps({"choices": [{"message": {"role": "assistant", "content": "hello from model"}}]}),
              {"Content-Type": "application/json"}, 0.01
          )
          assert "hello from model" in Scanner._llm_text(json_response)

          sse = Response(
              200, "http://example.test",
              'data: {"choices":[{"delta":{"content":"hello "}}]}\n\n'
              'data: {"choices":[{"delta":{"content":"world"}}]}\n\n'
              'data: [DONE]\n',
              {"Content-Type": "text/event-stream"}, 0.01
          )
          parsed_sse = Scanner._llm_text(sse)
          assert "hello" in parsed_sse and "world" in parsed_sse, parsed_sse

          marker = "SATRIA-TOOL-CANARY"
          tool_result = Response(
              200, "http://example.test",
              json.dumps({"messages": [{"role": "tool", "content": marker}]}), {}, 0.01
          )
          fake_tool_call = Response(
              200, "http://example.test",
              json.dumps({"choices": [{"message": {"role": "assistant", "tool_calls": [
                  {"function": {"name": "run", "arguments": marker}}
              ]}}]}), {}, 0.01
          )
          assert Scanner._llm_tool_evidence(tool_result, marker)
          assert not Scanner._llm_tool_evidence(fake_tool_call, marker)

          class ScannerStub:
              target_url = "https://example.test/"
              def _same_origin(self, url):
                  p, q = urlparse(url), urlparse(self.target_url)
                  return p.scheme == q.scheme and p.netloc == q.netloc

          stub = ScannerStub()
          page = Page(
              url="https://example.test/",
              text='<script>fetch("/api/v1/chat", {method:"POST"})</script>',
              js_text='axios.post("/assistant/message", body)',
          )
          candidates = Scanner._llm_candidates(stub, [page], [])
          urls = {item["url"] for item in candidates}
          assert "https://example.test/api/v1/chat" in urls
          assert "https://example.test/assistant/message" in urls
          print("PASS: JSON/SSE parsing, tool result distinction, endpoint discovery")
          PY
      - name: Web LLM body-shape validation regression
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import re
          import sys
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import requests

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          seen = []
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  size = int(self.headers.get("Content-Length", "0"))
                  body = json.loads(self.rfile.read(size) or b"{}")
                  seen.append(body)
                  if not isinstance(body.get("messages"), list):
                      self.send_response(400)
                      self.send_header("Content-Length", "0")
                      self.end_headers()
                      return
                  prompt = body["messages"][0].get("content", "")
                  match = re.search(r"(SATRIA-LLM-CANARY-[A-Fa-f0-9]+)", prompt)
                  result = match.group(1) if match else "missing"
                  payload = json.dumps({
                      "choices": [{"message": {"role": "assistant", "content": result}}]
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)
              def log_message(self, *_args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          base = f"http://127.0.0.1:{server.server_port}/api/chat"
          try:
              scanner = Scanner.__new__(Scanner)
              scanner.target_url = base
              scanner.session = requests.Session()
              scanner.timeout = 2.0
              scanner.started = time.monotonic()
              scanner.deadline_seconds = 25.0
              scanner.max_requests = 100
              scanner.non_sql_category_request_limit = 32
              scanner.request_count = 0
              scanner._scan_progress = {
                  "index": 20, "total": 23, "label": "Web LLM", "event_seq": 0,
                  "request_start": 0, "request_limit": 100,
              }
              scanner.stats = {"requests": 0, "errors": []}
              endpoint = {
                  "url": base, "method": "POST", "kind": "json",
                  "field": "message", "page_url": base,
              }
              valid = scanner._llm_validate([endpoint])
              assert valid and valid[0]["body_style"] == "messages", valid
              assert any("messages" in body for body in seen), seen
              print("PASS: endpoint validates OpenAI-compatible messages body after invalid shapes")
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=2)
          PY
