name: SATRIA JWT and Web LLM regression

on:
  push:
    branches:
      - fix/jwt-web-llm-20261114

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused runtime dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 "PyJWT[crypto]>=2.8,<3" "gmpy2>=2.3,<3"
      - name: Compile complete engine
        run: python -m py_compile satria_engine.py
      - name: JWT helpers and RSA derivation
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          header = {"alg": "HS256", "typ": "JWT"}
          payload = {"sub": "wiener", "username": "wiener", "exp": 4102444800}
          token = Scanner._jwt_sign(header, payload, key="secret1", alg="HS256")
          assert token and Scanner._jwt_decode(token)["payload"]["sub"] == "wiener"
          extracted = Scanner._jwt_tokens_in_text(
              "Set-Cookie: session=" + token + "; Path=/; HttpOnly"
          )
          assert token in extracted, extracted
          extracted_json = Scanner._jwt_tokens_in_text(
              json.dumps({"access_token": token, "nested": {"authorization": "Bearer " + token}})
          )
          assert token in extracted_json, extracted_json

          # Two independent RS256 signatures from one key must allow RSA modulus derivation.
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          private = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          private_pem = private.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          )
          rs_tokens = [
              Scanner._jwt_sign(
                  {"alg": "RS256", "typ": "JWT"},
                  {"sub": "wiener", "iat": 1700000000 + index, "nonce": str(index)},
                  key=private_pem, alg="RS256",
              )
              for index in (1, 2)
          ]
          derived = Scanner._jwt_rsa_pem_from_tokens(rs_tokens)
          assert derived and "BEGIN PUBLIC KEY" in derived[0], "RSA modulus derivation failed"
          print("PASS: compact JWT extraction, HMAC signing, and rsa_sign2n derivation")
          PY
      - name: JWT bypass confirmation regression
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import time
          import requests
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          def run_case(initial_confirmed, accept_mode):
              scanner = Scanner.__new__(Scanner)
              scanner.target_url = "https://jwt-test.invalid/"
              scanner.session = requests.Session()
              scanner.started = time.monotonic()
              scanner.deadline_seconds = 300
              scanner.request_count = 0
              scanner._within_budget = lambda: True
              scanner.non_sql_category_request_limit = 32
              scanner._scan_progress = {"index": 16, "request_start": 0, "request_limit": 120}
              scanner._confirmed = set(initial_confirmed)
              scanner.stats = {"requests": 0, "errors": []}
              key = "known-secret"
              original = Scanner._jwt_sign(
                  {"alg": "HS256", "typ": "JWT"},
                  {"sub": "wiener", "username": "wiener"},
                  key=key, alg="HS256",
              )
              scanner._jwt_login = lambda pages: scanner.session
              scanner._jwt_collect_tokens = lambda pages, sess: [(original, "cookie", "session")]
              scanner._ac_admin_urls = lambda pages, origin: []
              scanner._same_origin = lambda url: url.startswith("https://jwt-test.invalid/")
              marked = []
              scanner._jwt_mark = lambda number, url, evidence, method: marked.append(number)

              def fake_request(method, url, *, session=None, headers=None, **kwargs):
                  token = ""
                  if session is not None:
                      token = session.cookies.get("session", "")
                  if headers and headers.get("Authorization", "").startswith("Bearer "):
                      token = headers["Authorization"][7:]
                  decoded = Scanner._jwt_decode(token) if token else None
                  admin = False
                  if decoded:
                      h = decoded["header"]
                      p = decoded["payload"]
                      if p.get("sub") == "administrator":
                          if accept_mode == "any-forged":
                              admin = True
                          elif accept_mode == "none-only":
                              admin = h.get("alg") == "none" and decoded["parts"][2] == ""
                  return SimpleNamespace(
                      error=None,
                      status=200 if admin else 403,
                      text="Admin panel - Delete user" if admin else "Forbidden",
                      headers={},
                  )

              scanner._request = fake_request
              scanner.phase_jwt([], [])
              return marked

          assert 147 in run_case([], "any-forged"), "unverified signature bypass not confirmed"
          assert 148 in run_case([147], "none-only"), "alg=none bypass not confirmed"
          print("PASS: end-to-end mocked verification for unverified-signature and alg=none")
          PY
      - name: Web LLM parsing and discovery regression
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          openai = SimpleNamespace(text=json.dumps({
              "choices": [{"message": {"role": "assistant", "content": "hello from model"}}]
          }))
          assert Scanner._llm_text(openai) == "hello from model"

          anthropic = SimpleNamespace(text=json.dumps({
              "content": [{"type": "text", "text": "hello from anthropic"}]
          }))
          assert Scanner._llm_text(anthropic) == "hello from anthropic"

          sse = SimpleNamespace(text=(
              'data: {"choices":[{"delta":{"content":"hello "}}]}\n'
              'data: {"choices":[{"delta":{"content":"world"}}]}\n'
              'data: [DONE]\n'
          ))
          parsed_sse = Scanner._llm_text(sse)
          assert "hello " in parsed_sse and "world" in parsed_sse, parsed_sse

          tool_result = SimpleNamespace(text=json.dumps({
              "messages": [{"role": "tool", "name": "debug_sql", "content": "SATRIA-CANARY-123"}]
          }))
          tool_call_only = SimpleNamespace(text=json.dumps({
              "choices": [{"message": {"tool_calls": [
                  {"function": {"name": "debug_sql", "arguments": "SATRIA-CANARY-123"}}
              ]}}]
          }))
          assert Scanner._llm_tool_evidence(tool_result, "SATRIA-CANARY-123")
          assert not Scanner._llm_tool_evidence(tool_call_only, "SATRIA-CANARY-123")

          scanner = Scanner.__new__(Scanner)
          scanner.target_url = "https://llm-test.invalid/"
          scanner._same_origin = lambda url: url.startswith("https://llm-test.invalid/")
          unrelated = SimpleNamespace(
              url="https://llm-test.invalid/contact",
              text="",
              js_text="",
              forms=[SimpleNamespace(
                  page_url="https://llm-test.invalid/contact",
                  action="/api/email", method="POST",
                  fields=(("email", "", "email"),),
              )],
          )
          actual_chat = SimpleNamespace(
              url="https://llm-test.invalid/live-chat",
              text="",
              js_text='fetch("/api/live-chat", {method:"POST"})',
              forms=[SimpleNamespace(
                  page_url="https://llm-test.invalid/live-chat",
                  action="/api/live-chat", method="POST",
                  fields=(("message", "", "text"),),
              )],
          )
          points = [SimpleNamespace(
              url="https://llm-test.invalid/api/email",
              method="GET", name="email", label="email field", original="", fields=(),
          )]
          candidates = scanner._llm_candidates([unrelated, actual_chat], points)
          urls = [item["url"] for item in candidates]
          assert "https://llm-test.invalid/api/live-chat" in urls, urls
          assert "https://llm-test.invalid/api/email" not in urls, urls

          # Chat Completions/messages body is created in the expected shape.
          captured = {}
          scanner._request = lambda method, url, **kwargs: (
              captured.update({"method": method, "url": url, **kwargs})
              or SimpleNamespace(error=None, status=200, text='{"choices":[{"message":{"content":"ok"}}]}', headers={})
          )
          endpoint = {
              "url": "https://llm-test.invalid/api/chat", "method": "POST",
              "kind": "json", "field": "message", "body_style": "messages",
          }
          scanner._llm_send(endpoint, "test prompt")
          body = json.loads(captured["data"])
          assert body["messages"] == [{"role": "user", "content": "test prompt"}], body
          print("PASS: OpenAI/Anthropic/SSE parsing, tool-result validation, route discovery, and request shape")
          PY

      - name: Web LLM tool inventory and non-destructive action regression
        run: |
          python - <<'PY'
          import importlib.util
          import re
          import sys
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner

          scanner = Scanner.__new__(Scanner)
          scanner.target_url = "https://llm-test.invalid/"
          scanner._confirmed = set()
          scanner._scan_progress = None
          scanner._within_budget = lambda: True
          endpoint = {
              "url": "https://llm-test.invalid/api/live-chat",
              "method": "POST", "kind": "json", "field": "message",
              "body_style": "flat",
          }
          scanner._llm_candidates = lambda pages, points: [endpoint]
          scanner._llm_validate = lambda eps: eps
          marks = []
          scanner._llm_mark = lambda number, url, evidence, method: marks.append((number, evidence))

          def fake_send(ep, prompt, **kwargs):
              if "security inventory" in prompt.lower():
                  answer = (
                      "Available APIs and functions:\\n"
                      "- Debug SQL API: executes database queries\\n"
                      "- Delete User API: deletes a user by username\\n"
                      "- Newsletter Subscription API: subscribes an email address"
                  )
                  body = {"choices": [{"message": {"role": "assistant", "content": answer}}]}
              elif "satria-nonexistent-" in prompt:
                  match = re.search(r"(satria-nonexistent-[a-f0-9]{14})", prompt)
                  assert match, prompt
                  body = {"messages": [{
                      "role": "tool", "name": "delete_user",
                      "content": f"User {match.group(1)} not found",
                  }]}
              else:
                  body = {"choices": [{
                      "message": {"role": "assistant", "content": "I cannot call any tools for this request."}
                  }]}
              return SimpleNamespace(error=None, status=200, headers={}, text=__import__("json").dumps(body))

          scanner._llm_send = fake_send
          scanner.phase_web_llm_attacks([], [])
          numbers = {number for number, _evidence in marks}
          assert 174 in numbers, marks
          assert 178 in numbers, marks
          assert any("tidak ada" in evidence.lower() for number, evidence in marks if number == 178)
          print("PASS: plain-text tool inventory and nonexistent-user delete probe")
          PY

      - name: Web LLM validation regression
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import re
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("satria_engine", "satria_engine.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          Scanner = module.SatriaBaruScanner
          scanner = Scanner.__new__(Scanner)
          scanner._within_budget = lambda: True
          calls = []
          def fake_send(ep, prompt, **kwargs):
              calls.append((ep["url"], kwargs))
              match = re.search(r"(SATRIA-LLM-CANARY-[A-Fa-f0-9]+)", prompt)
              marker = match.group(1)[::-1] if match else "missing"
              return SimpleNamespace(
                  error=None, status=200, headers={},
                  text='{"choices":[{"message":{"role":"assistant","content":"' + marker + '"}}]}',
              )
          scanner._llm_send = fake_send
          endpoints = [{
              "url": "https://llm-test.invalid/api/chat", "method": "POST",
              "kind": "json", "field": "message", "body_style": "flat",
          }]
          valid = scanner._llm_validate(endpoints)
          assert valid and valid[0]["body_style"] in ("flat", "messages", "input", "query")
          print(f"PASS: LLM endpoint validation using {valid[0]['body_style']} payload")
          PY
